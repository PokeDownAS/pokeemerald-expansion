name: Emerald Deluxe Safe Build
# Diagnostic rebuild trigger for PlusleUltra starter compile

on:
  push:
    branches:
      - emerald-deluxe-safe
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3-pil python3

      - name: Apply safe trainer scaling
        run: python3 tools/emerald_deluxe_safe/level_scale.py

      - name: Upgrade trainer parties and movesets
        run: python3 tools/emerald_deluxe_safe/trainer_upgrade.py

      - name: Hand-tune bosses and held items
        run: python3 tools/emerald_deluxe_safe/boss_balance.py

      - name: Upgrade rivals villains and grunts
        run: python3 tools/emerald_deluxe_safe/story_battles.py

      - name: Hand-tune admins and postgame superbosses
        run: python3 tools/emerald_deluxe_safe/admin_postgame.py

      - name: Polish ordinary route trainers
        run: python3 tools/emerald_deluxe_safe/route_trainer_polish.py

      - name: Apply safe encounter variety
        run: python3 tools/emerald_deluxe_safe/encounters.py

      - name: Apply dungeon forest and water encounters
        run: python3 tools/emerald_deluxe_safe/dungeon_encounters.py

      - name: Guarantee full Gen 1-9 catchability
        run: python3 tools/emerald_deluxe_safe/catchable_dex.py

      - name: Smooth encounter progression
        run: python3 tools/emerald_deluxe_safe/encounter_progression.py

      - name: Apply easier evolutions
        run: python3 tools/emerald_deluxe_safe/easier_evolutions.py

      - name: Add obtainable Mega Stones
        run: python3 tools/emerald_deluxe_safe/mega_stones.py

      - name: Place exploration Mega Stones
        run: python3 tools/emerald_deluxe_safe/mega_exploration.py

      - name: Apply quality-of-life features
        run: python3 tools/emerald_deluxe_safe/qol.py

      - name: Add PlusleUltra custom starter
        run: python3 tools/emerald_deluxe_safe/plusle_ultra.py

      - name: Build
        id: build
        env:
          GAME_VERSION: EMERALD
          GAME_REVISION: 0
          GAME_LANGUAGE: ENGLISH
          COMPARE: 0
        run: |
          set +e
          make -j$(nproc) -O all 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          exit $status

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emerald-deluxe-safe-build-log
          path: build.log
          if-no-files-found: warn

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Automated build failure report for commit `${{ github.sha }}`.'
            echo
            echo '```text'
            grep -E -i '(^|: )(fatal error|error:|undefined reference|make(\[[0-9]+\])?: \*\*\*)' build.log | tail -n 120 || tail -n 120 build.log
            echo '```'
          } > failure.md
          existing=$(gh issue list --state open --search 'Emerald Deluxe build failure in:title' --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file failure.md
          else
            gh issue create --title 'Emerald Deluxe build failure' --body-file failure.md
          fi

      - name: Upload ROM artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: emerald-deluxe-safe-rom
          path: '*.gba'
          if-no-files-found: error
